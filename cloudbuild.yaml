# GitHub push -> Cloud Build -> pre-flight checks -> tests -> Artifact Registry -> Cloud Run.
# Everything is created/checked by this file; only the 3 secrets (see DEPLOY.md) must exist beforehand.
substitutions:
  _REGION: asia-south1                    # VERIFY
  _SERVICE: pmax-themer
  _AR_REPO: pmax-themer
  _LOGS_BUCKET: celestial-feat-513918-q9-pmax-build-logs   # create once (see DEPLOY.md)
  _RUN_SA_NAME: sa-gads-ai-runner         # builds AND runs the service (trigger must use this SA too)
  _ADMIN_EMAILS: jakaria.ahmed@wppmedia.com
  _ORG_NAME: ABG

# Custom build SA without Logs Writer: log to a bucket the SA can already write (Storage Object Admin).
options:
  logging: GCS_ONLY
  logsBucket: gs://${_LOGS_BUCKET}

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/gads-credentials/versions/latest
      env: GADS_JSON
    - versionName: projects/$PROJECT_ID/secrets/pmax-app-users/versions/latest
      env: APP_USERS
    - versionName: projects/$PROJECT_ID/secrets/pmax-secret-key/versions/latest
      env: SECRET_KEY_VAL

steps:
  # ---- 1. pre-flight: fail early with a clear message (secret values are never printed)
  - id: preflight
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    secretEnv: [GADS_JSON, APP_USERS, SECRET_KEY_VAL]
    args:
      - -c
      - python3 scripts/preflight.py $PROJECT_ID ${_REGION} ${_RUN_SA_NAME}@$PROJECT_ID.iam.gserviceaccount.com ${_AR_REPO} ${_LOGS_BUCKET}

  # ---- 2. tests
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements-dev.txt && python -m pytest -q"]

  # ---- 3. Artifact Registry repo (created once, idempotent)
  - id: ensure-artifact-repo
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe ${_AR_REPO} --location=${_REGION} --project=$PROJECT_ID >/dev/null 2>&1 \
          || gcloud artifacts repositories create ${_AR_REPO} --repository-format=docker \
               --location=${_REGION} --project=$PROJECT_ID --description="pmax-themer images" \
          || echo "could not describe/create the repo (it may exist with write-only access); continuing, push will fail if it is really missing"

  # ---- 4. build + push
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"]

  # ---- 5. deploy
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUN_SA_NAME}@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated            # the app's own login is the gate
      - --max-instances=1
      - --concurrency=20
      # --update-* (not --set-*): settings you changed by hand (ALLOW_MUTATE, ADS_ACCESS, OAUTH_*, extra secrets) survive a CI deploy.
      - --update-env-vars=^@^ENV=prod@AUTH_MODE=basic@ADS_BACKEND=real@ORG_NAME=${_ORG_NAME}@ADMIN_EMAILS=${_ADMIN_EMAILS}
      - --update-secrets=SECRET_KEY=pmax-secret-key:latest,APP_USERS_JSON=pmax-app-users:latest,GOOGLE_ADS_CREDENTIALS_JSON=gads-credentials:latest

  # ---- 6. post-deploy smoke test: the login page must answer 200
  - id: smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe ${_SERVICE} --region=${_REGION} --project=$PROJECT_ID --format='value(status.url)')
        code=$(curl -s -o /dev/null -w '%{http_code}' "$$URL/login")
        echo "GET /login -> $$code ($$URL)"
        [ "$$code" = "403" ] && echo "403 = public access blocked (org policy on allUsers?). Service is deployed but not reachable publicly."
        [ "$$code" = "200" ]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
